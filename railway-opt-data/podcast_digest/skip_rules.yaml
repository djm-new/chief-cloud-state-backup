# Podcast Intelligence skip and scoring rules — v0.1

core_selection_test:
  include_if_episode_likely_creates:
    - immediate action DJ may want to take
    - changed mental model
    - new strategic or investing framework
    - addition to personal/professional toolkit
    - rare access to a market/business shaper

high_priority_topics:
  - AI business implications
  - frontier AI models and agents
  - compute, chips, data centers when tied to market/business strategy
  - capital allocation
  - markets through the lens of great allocators
  - venture capital only when top-tier and industry-directional
  - private equity / hedge funds / banks / asset managers
  - influential CEOs and founders
  - company building and strategy
  - product/market structure
  - platform shifts
  - business model changes
  - intellectual frameworks with business/professional relevance

low_priority_or_skip_topics:
  - news recaps
  - political commentary
  - culture war commentary
  - celebrity interviews
  - entertainment interviews
  - sports unless major business/framework relevance
  - energy and climate for this specific digest
  - defense and geopolitics unless directly tied to AI/business/markets
  - generic macro chatter without differentiated allocator insight
  - generic VC fundraising/promotional content
  - second-tier VC trend commentary
  - biography-heavy origin stories without frameworks
  - product launch PR conversations
  - crypto price chatter unless structural market/business relevance

anti_fluff_penalties:
  generic_vc_nonsense:
    penalty: high
    patterns:
      - talks in slogans about AI changing everything without specifics
      - portfolio company promotion masquerading as analysis
      - fundraising announcement interviews
      - generic market map discussion
      - no examples of actual decisions, tradeoffs, or frameworks
  celebrity_content:
    penalty: very_high
    patterns:
      - actor/musician/personality with no business/intellectual framework angle
      - fame-driven interview
  news_format:
    penalty: high
    patterns:
      - daily headlines
      - panel reactions
      - politics-first framing
      - horse-race commentary
  shallow_operator_interview:
    penalty: medium
    patterns:
      - mostly origin story
      - generic leadership advice
      - no strategic depth
      - no new framework

scoring_dimensions:
  guest_caliber:
    weight: 25
    questions:
      - Does this person move markets or shape an important industry?
      - Is this a rare or unusually candid conversation?
  topic_relevance:
    weight: 20
    questions:
      - Is the topic central to current business/AI/markets environment?
      - Is this relevant to DJ professionally or intellectually?
  conversation_depth:
    weight: 20
    questions:
      - Is this likely to be a rich conversation, not a promo tour?
      - Are there decisions, frameworks, or tradeoffs discussed?
  novelty_edge:
    weight: 15
    questions:
      - Is there a non-consensus idea or new framework?
      - Does this add something beyond common knowledge?
  actionability_toolkit:
    weight: 15
    questions:
      - Could DJ act on this, think differently, or add it to his toolkit?
  timeliness:
    weight: 5
    questions:
      - Did this come out today or this week?
      - Is the conversation timely enough to matter now?

labels:
  must_listen:
    threshold: 85
    meaning: DJ should seriously consider listening to the original.
  digest_only:
    threshold: 70
    meaning: Worth knowing; summary probably sufficient.
  skim_if_interested:
    threshold: 55
    meaning: Mention briefly or include in honorable mentions.
  skip:
    threshold: 0
    meaning: Do not surface unless needed for calibration logs.

summary_requirements:
  daily_text_digest:
    include:
      - episode title
      - show name
      - guest name if available
      - source link
      - listen/skim/skip recommendation
      - why DJ should care
      - key ideas
      - possible action/framework/toolkit addition
      - transcript_status: transcript-based or metadata-only
  weekly_audio_digest:
    style: two-host conversational
    target_length_minutes: 15-20
    framing: "what's interesting in the podcast world for DJ this week"
    avoid:
      - reading speaker labels aloud
      - mechanical episode-by-episode listing
      - generic podcast newsletter tone
