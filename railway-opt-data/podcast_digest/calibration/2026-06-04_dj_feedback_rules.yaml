scoring_implications:
  listen:
    description: "Original audio likely worth DJ's time. Use sparingly."
    target_daily_count: "3-8 max before transcript/refinement; 1-3 in final daily must-listen."
  digest:
    description: "Worth summarizing in daily text; original audio optional or unnecessary."
    target_daily_count: "10-20 broad-net items."
  scan:
    description: "Mention briefly or investigate further if metadata is intriguing."
  skip:
    description: "Do not surface except calibration/debug logs."

prompt_guidance:
  - Benedict Evans / Ben Evans appearances: high-priority for rational AI economics, tech strategy, market structure, and value-accrual frameworks.
  - Do not equate AI technical novelty with listen-worthy.
  - Promote major market/macro thinkers, scaled CEOs/operators, capital allocators, AI economics, and business model implications.
  - Prefer summaries for technical AI research, vendor/product episodes, and news-panel episodes unless they contain a unique strategic frame.
  - Penalize vertical enterprise AI vendor stories unless they generalize to a broader business model/platform lesson.
  - Penalize Bloomberg/news recaps unless the named guest/topic is exceptional.
  - Always treat Stratechery weekly/best-of content as at least digest/listen candidate.
