# DJ podcast calibration feedback from Qwen episode-level pass — 2026-06-04
# Source: /opt/data/podcast_digest/outputs/2026-06-04_2105-qwen-episode-calibration.md

core_adjustments:
  - Qwen was too generous: 23 listen / 37 digest is too broad for listen tier.
  - Daily text should still cast a wider net, but "listen" must be reserved for episodes DJ explicitly would listen to or likely high-payoff originals.
  - Many technical AI episodes should be summarized, not listened to, and some should be skipped despite high AI relevance.
  - Show priors matter only as priors; episode-level judgment remains authoritative.
  - Stratechery weekly/best-of content should be included/listened to so DJ does not miss it.

